
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <div class="heading">
            <span class="icon">₹</span>
            <h1>Tip Calculator</h1>
            <p>Calculate your tip and split the bill easily.</p>
        </div>

        <div class="form-group">
            <label for="bill">Bill Amount (₹)</label>
            <input type="number" id="bill" min="0" step="0.01" placeholder="Enter bill amount">
        </div>

        <div class="form-group">
            <label>Choose Tip Percentage</label>
            <div class="tip-options">
                <button type="button" class="tip-btn" data-tip="5">5%</button>
                <button type="button" class="tip-btn active" data-tip="10">10%</button>
                <button type="button" class="tip-btn" data-tip="15">15%</button>
                <button type="button" class="tip-btn" data-tip="20">20%</button>
            </div>
            <input type="number" id="customTip" min="0" max="100" placeholder="Or enter custom tip %">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" min="1" step="1" value="1">
        </div>

        <button type="button" id="resetBtn" class="reset-btn">Reset Calculator</button>

        <section class="results">
            <div class="result-card">
                <span>Total Tip</span>
                <h2 id="tipAmount">₹0.00</h2>
            </div>
            <div class="result-card">
                <span>Total Bill</span>
                <h2 id="totalBill">₹0.00</h2>
            </div>
            <div class="result-card highlight">
                <span>Tip Per Person</span>
                <h2 id="tipPerPerson">₹0.00</h2>
            </div>
            <div class="result-card highlight">
                <span>Total Per Person</span>
                <h2 id="totalPerPerson">₹0.00</h2>
            </div>
        </section>

        <p id="message" role="status"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
